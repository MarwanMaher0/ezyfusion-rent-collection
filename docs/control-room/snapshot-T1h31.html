<style>
:root{
  --bg:#0b0f14; --panel:#111821; --panel2:#0e141c; --line:#1e2a37; --line2:#2a3a4c;
  --text:#d9e2ec; --dim:#8094a8; --faint:#56687a;
  --ok:#3ecf8e; --okbg:rgba(62,207,142,.12); --bad:#ff5d5d; --badbg:rgba(255,93,93,.12);
  --warn:#f5b84b; --warnbg:rgba(245,184,75,.12); --run:#58a6ff; --runbg:rgba(88,166,255,.12);
  --kit:#b392f0; --kitbg:rgba(179,146,240,.12);
  --mono:ui-monospace,"JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 var(--sans)}
body{padding:18px 20px 28px}
.mono{font-family:var(--mono)}
.dim{color:var(--dim)} .faint{color:var(--faint)}
header{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;padding:6px 4px 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:600 12px/1 var(--mono);letter-spacing:.18em;color:var(--dim)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--okbg);animation:pulse 2s infinite}
.dot.static{background:var(--kit);box-shadow:0 0 0 3px var(--kitbg);animation:none}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(62,207,142,0)}}
h1{margin:8px 0 4px;font:600 21px/1.2 var(--sans);letter-spacing:-.01em}
.sub{color:var(--dim)}
.clock{display:grid;grid-template-columns:repeat(4,auto);gap:4px 26px;text-align:right}
.clock .big{font:600 40px/1 var(--mono);letter-spacing:-.02em}
.clock .lbl{font:600 10px/1 var(--mono);letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
.clock .val{font:600 18px/1.1 var(--mono)}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
button{background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:6px;padding:6px 11px;font:500 12px var(--sans);cursor:pointer}
button:hover{border-color:var(--run)}
.timeline{margin:16px 0 18px;position:relative}
.tl-bar{display:flex;height:34px;border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.seg{position:relative;border-right:1px solid var(--bg);background:var(--panel2);padding:4px 7px;overflow:hidden;white-space:nowrap}
.seg .n{font:600 11px/1.2 var(--sans);color:var(--dim);text-overflow:ellipsis;overflow:hidden;display:block}
.seg .t{font:10px/1.2 var(--mono);color:var(--faint)}
.seg.past{background:#13202b}.seg.past .n{color:var(--faint)}
.seg.now{background:var(--runbg);box-shadow:inset 0 -2px 0 var(--run)}.seg.now .n{color:var(--text)}
.seg.freeze{background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(245,184,75,.06) 6px 12px)}
.needle{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--run);box-shadow:0 0 10px var(--run)}
.stops{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 14px;min-width:0}
.panel h2{margin:0 0 10px;font:600 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
.panel h2 .r{color:var(--faint);letter-spacing:.04em;text-transform:none;font-weight:500}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.kpi .v{font:600 28px/1.05 var(--mono)}
.kpi .l{font:600 10px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-top:6px}
.kpi .s{color:var(--dim);margin-top:4px;font-size:12px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex;margin-top:8px}
.bar i{display:block;height:100%}
table{width:100%;border-collapse:collapse}
th{font:600 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:left;padding:0 8px 7px 0;border-bottom:1px solid var(--line)}
td{padding:6px 8px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--mono)}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 10.5px/1 var(--mono);letter-spacing:.04em;padding:4px 7px;border-radius:5px;white-space:nowrap;text-transform:uppercase}
.ok{color:var(--ok);background:var(--okbg)}.bad{color:var(--bad);background:var(--badbg)}.warn{color:var(--warn);background:var(--warnbg)}
.run{color:var(--run);background:var(--runbg)}.kit{color:var(--kit);background:var(--kitbg)}.none{color:var(--faint);background:rgba(128,148,168,.08)}
.hist{display:inline-flex;gap:3px;vertical-align:middle}
.hist b{width:7px;height:14px;border-radius:2px;display:inline-block}
.hist b.pass{background:var(--ok)}.hist b.fail{background:var(--bad)}
.reqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.req{border:1px solid var(--line2);border-radius:6px;padding:6px 6px 5px;font:600 12px/1 var(--mono);position:relative;background:var(--panel2)}
.req small{display:block;font:500 9.5px/1.2 var(--mono);color:var(--faint);margin-top:4px;text-transform:uppercase;letter-spacing:.04em}
.req.done{border-color:rgba(62,207,142,.5)}.req.done.tested{background:var(--okbg)}
.req.running,.req.review{border-color:rgba(88,166,255,.55);background:var(--runbg)}
.req.blocked{border-color:rgba(255,93,93,.55)}
.req.amb::after{content:"⚠";position:absolute;top:4px;right:5px;font-size:10px;color:var(--warn)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;color:var(--dim);font-size:11.5px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block;border:1px solid var(--line2)}
.area{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line)}
.area:last-child{border-bottom:0}
.area .name{font-weight:600}
.area .cnt{font:600 13px var(--mono);text-align:right}
.area .bar{grid-column:1/-1;margin-top:5px}
.area .meta{grid-column:1/-1;color:var(--faint);font:11px var(--mono)}
.checks{display:grid;grid-template-columns:1fr auto;gap:0}
.checks div{padding:6px 0;border-bottom:1px solid var(--line)}
.commit{display:grid;grid-template-columns:58px 64px 1fr auto;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);align-items:baseline}
.commit:last-child{border-bottom:0}
.dec{display:grid;grid-template-columns:42px 1fr auto;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);align-items:baseline}
.dec:last-child{border-bottom:0}
.dec .why{color:var(--faint);font-size:12px;margin-top:2px}
.fail-msg{color:var(--bad);font:11px/1.35 var(--mono);margin-top:3px;white-space:pre-wrap;word-break:break-word}
.scroll{max-height:420px;overflow:auto}
.empty{color:var(--faint);padding:10px 0;font-style:italic}
.tiny{font-size:11px}
.stack{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.svc{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:var(--panel2)}
footer{margin-top:16px;color:var(--faint);font:11px var(--mono);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media (max-width:1100px){.c2,.c3,.c4,.c5,.c6,.c7,.c8{grid-column:span 12}.clock{grid-template-columns:repeat(2,auto)}header{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div>
    <div class="brand"><span class="dot" id="live"></span><span id="mode">CONTROL ROOM · LIVE</span></div>
    <h1 id="title">—</h1>
    <div class="sub" id="subtitle">—</div>
  </div>
  <div>
    <div class="clock">
      <div><div class="lbl">Elapsed / 4:00</div><div class="big" id="elapsed">--:--:--</div></div>
      <div><div class="lbl">Remaining</div><div class="val" id="remaining">—</div><div class="lbl" style="margin-top:10px">Freeze in</div><div class="val" id="freeze">—</div></div>
      <div><div class="lbl">Phase</div><div class="val" id="phase">—</div><div class="lbl" style="margin-top:10px">Next hard stop</div><div class="val" id="nextstop">—</div></div>
      <div><div class="lbl">Started</div><div class="val" id="started">—</div><div class="lbl" style="margin-top:10px">Now</div><div class="val" id="now">—</div></div>
    </div>
    <div class="actions"><button id="snap">Save snapshot → app/docs</button></div>
  </div>
</header>

<section class="timeline"><div class="tl-bar" id="tl"></div><div class="needle" id="needle" style="display:none"></div><div class="stops" id="stops"></div></section>

<main class="grid" id="main">
  <div class="panel kpi c2" id="k-req"></div>
  <div class="panel kpi c2" id="k-tests"></div>
  <div class="panel kpi c2" id="k-gates"></div>
  <div class="panel kpi c2" id="k-sec"></div>
  <div class="panel kpi c2" id="k-agents"></div>
  <div class="panel kpi c2" id="k-dec"></div>

  <div class="panel c4"><h2>Graded areas <span class="r">tests by folder</span></h2><div id="areas"></div></div>
  <div class="panel c8"><h2>Gates <span class="r" id="gates-r"></span></h2><div id="gates"></div></div>

  <div class="panel c6"><h2>Lanes · BOARD.md <span class="r" id="board-r"></span></h2><div class="scroll" id="board"></div></div>
  <div class="panel c6"><h2>Agents <span class="r" id="agents-r"></span></h2><div id="agents-types"></div><div class="scroll" id="agents" style="margin-top:10px"></div></div>

  <div class="panel c7"><h2>Requirements <span class="r" id="req-r"></span></h2><div id="reqs"></div></div>
  <div class="panel c5"><h2>Security posture · live DB <span class="r" id="db-r"></span></h2><div id="security"></div></div>

  <div class="panel c6"><h2>Decisions · DECISIONS.md <span class="r" id="dec-r"></span></h2><div class="scroll" id="decisions"></div></div>
  <div class="panel c6"><h2>Commits · ./app <span class="r" id="commits-r"></span></h2><div class="scroll" id="commits"></div></div>

  <div class="panel c8"><h2>Test files <span class="r" id="tests-r"></span></h2><div class="scroll" id="testfiles"></div></div>
  <div class="panel c4"><h2>Stack & code</h2><div id="stack"></div></div>
</main>
<footer><span id="foot-l"></span><span id="foot-r"></span></footer>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(Math.floor(n)).padStart(2, '0');
const hms = (min) => min == null ? '--:--:--' : `${pad(min / 60)}:${pad(min % 60)}:${pad((min * 60) % 60)}`;
const hm = (min) => min == null ? '—' : `${min < 0 ? '−' : ''}${Math.floor(Math.abs(min) / 60)}:${pad(Math.abs(min) % 60)}`;
const tplus = (ms) => ms == null ? '' : `T+${hm(ms / 60000)}`;
const ago = (t, now) => { if (!t) return '—'; const s = Math.max(0, (now - t) / 1000); return s < 60 ? `${Math.floor(s)}s ago` : s < 3600 ? `${Math.floor(s / 60)}m ago` : `${Math.floor(s / 3600)}h ago`; };
const clockTime = (t) => t ? new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }) : '—';
const k = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(n || 0);
const chip = (cls, text) => `<span class="chip ${cls}">${esc(text)}</span>`;
const stateChip = (s) => ({ done: chip('ok', '✔ done'), review: chip('run', '◐ review'), running: chip('run', '● running'), blocked: chip('bad', '■ blocked'), todo: chip('none', '○ todo'), idle: chip('warn', '◌ idle'), unplanned: chip('none', '— unplanned') }[s] || chip('none', s));
const pf = (s) => s === 'pass' || s === 'PASS' ? chip('ok', '✔ pass') : s === 'fail' || s === 'FAIL' ? chip('bad', '✖ fail') : chip('none', '— not run');
const kpi = (id, v, l, s, bar) => { $(id).innerHTML = `<div class="v">${v}</div><div class="l">${esc(l)}</div><div class="s">${s}</div>${bar || ''}`; };
const bar = (parts) => `<div class="bar">${parts.filter((p) => p[0] > 0).map(([w, c]) => `<i style="width:${w}%;background:${c}"></i>`).join('')}</div>`;
const shortModel = (m) => (m || '').replace(/^claude-/, '').replace(/-\d{8}$/, '') || '—';

function render(st) {
  const { clock, meta } = st; const now = clock.now; const E = clock.elapsedMin;
  $('title').textContent = meta.title;
  $('subtitle').textContent = `Lead engineer: Claude (multi-agent team) · Decisions: ${meta.candidate} · ${meta.host}`;
  $('elapsed').textContent = hms(E);
  $('elapsed').style.color = E == null ? '' : E >= 230 ? 'var(--bad)' : E >= 180 ? 'var(--warn)' : '';
  $('remaining').textContent = E == null ? '—' : hm(240 - E);
  $('freeze').textContent = E == null ? '—' : E >= 180 ? 'FROZEN' : hm(180 - E);
  $('phase').textContent = clock.phase ? clock.phase.name : (E == null ? 'not started' : '—');
  const stops = st.gates.stops || {};
  const nxt = clock.phases.find((p) => p.stop && !stops[p.stop]);
  $('nextstop').textContent = nxt ? `(${nxt.stop}) @ ${hm(nxt.to)}` : 'all passed';
  $('started').textContent = clockTime(clock.start); $('now').textContent = clockTime(now);

  // timeline
  $('tl').innerHTML = clock.phases.map((p) => {
    const cls = E == null ? '' : E >= p.to ? 'past' : E >= p.from ? 'now' : '';
    return `<div class="seg ${cls} ${p.from >= 180 ? 'freeze' : ''}" style="flex:${p.to - p.from}" title="${esc(p.name)}"><span class="n">${esc(p.name)}</span><span class="t">${hm(p.from)}–${hm(p.to)}${p.stop ? ` · stop ${p.stop}` : ''}</span></div>`;
  }).join('');
  const nd = $('needle');
  if (E != null) { nd.style.display = 'block'; nd.style.left = `calc(${Math.min(100, (E / 240) * 100)}% - 1px)`; } else nd.style.display = 'none';
  $('stops').innerHTML = ['a', 'b', 'c'].map((id) => {
    const p = clock.phases.find((x) => x.stop === id); const s = stops[id];
    const label = { a: 'SPEC + PLAN approved', b: 'schema + RLS + seed', c: 'payments + idempotency + webhook' }[id];
    return s ? chip('ok', `✔ hard stop ${id} · ${label} · ${tplus(Date.parse(s.ts) - clock.start)}`) : chip(E != null && E > p.to ? 'warn' : 'none', `○ hard stop ${id} · ${label} · due ${hm(p.to)}`);
  }).join('');

  // KPIs
  const R = st.requirements; const rDone = R.filter((r) => r.state === 'done').length; const rTested = R.filter((r) => r.tests > 0).length;
  kpi('k-req', `${rDone}<span class="dim">/${R.length}</span>`, 'Requirements done', `${rTested} referenced by tests`, R.length ? bar([[rDone / R.length * 100, 'var(--ok)'], [R.filter((r) => r.state === 'running' || r.state === 'review').length / R.length * 100, 'var(--run)']]) : '');
  const T = st.tests.suite;
  kpi('k-tests', T ? `${T.passed}<span class="dim">/${T.total}</span>` : '—', 'Tests passing', T ? `${T.failed ? `<span style="color:var(--bad)">${T.failed} failing</span>` : 'none failing'} · ${T.skipped} skipped · ${ago(T.at, now)}` : 'no report yet', T && T.total ? bar([[T.passed / T.total * 100, 'var(--ok)'], [T.failed / T.total * 100, 'var(--bad)']]) : '');
  const G = st.gates.steps; const gOk = G.filter((g) => g.last.status === 'pass').length;
  kpi('k-gates', G.length ? `${gOk}<span class="dim">/${G.length}</span>` : '—', 'Gate steps green', `${st.gates.runs} logged runs`, G.length ? bar([[gOk / G.length * 100, 'var(--ok)'], [(G.length - gOk) / G.length * 100, 'var(--bad)']]) : '');
  const V = st.gates.verdicts;
  kpi('k-sec', `<span style="font-size:20px">${V.security ? pf(V.security.status) : chip('none', '— pending')}</span>`, 'Security auditor', `reviewer ${V.reviewer ? pf(V.reviewer.status) : chip('none', 'pending')}`);
  const A = st.agents; const running = A.subs.filter((s) => s.state === 'running').length;
  kpi('k-agents', `${A.subs.length}`, 'Subagent runs', `${running ? `<span style="color:var(--run)">${running} running now</span>` : 'none running'} · ${A.byType.length} roles`);
  const D = st.decisions; const pend = D.filter((d) => d.kind === 'pending').length;
  kpi('k-dec', `${D.length}`, 'Decisions logged', pend ? `<span style="color:var(--warn)">${pend} awaiting ${esc(meta.candidate)}</span>` : `all signed off`);

  // graded areas
  $('areas').innerHTML = st.tests.areas.map((a) => {
    const tot = a.passed + a.failed + a.skipped;
    const status = !tot ? chip('none', 'no tests') : a.failed ? chip('bad', `✖ ${a.failed} failing`) : chip('ok', '✔ green');
    return `<div class="area"><div class="name">${esc(a.name)}</div><div class="cnt">${tot ? `${a.passed}/${tot}` : '—'}</div>${tot ? bar([[a.passed / tot * 100, 'var(--ok)'], [a.failed / tot * 100, 'var(--bad)'], [a.skipped / tot * 100, 'var(--warn)']]) : '<div class="bar"></div>'}<div class="meta">${a.dirs.map((d) => 'tests/' + d).join(' · ') || 'other folders'} · ${a.files} files &nbsp; ${status}</div></div>`;
  }).join('');

  // gates
  $('gates-r').textContent = G.length ? `last run ${ago(Math.max(...G.map((g) => Date.parse(g.last.ts))), now)}` : 'bash ../scripts/gate.sh fast';
  $('gates').innerHTML = G.length ? `<table><tr><th>Step</th><th>Gate</th><th>Status</th><th class="num">Time</th><th>At</th><th>History (old → new)</th></tr>${G.map((g) => `<tr><td class="mono">${esc(g.name)}</td><td class="dim">${esc(g.last.gate)}</td><td>${pf(g.last.status)}</td><td class="num">${(g.last.ms / 1000).toFixed(1)}s</td><td class="dim mono tiny">${tplus(Date.parse(g.last.ts) - clock.start)}</td><td><span class="hist">${g.history.map((h) => `<b class="${h}" title="${h}"></b>`).join('')}</span></td></tr>${g.last.status === 'fail' ? `<tr><td colspan="6"><details><summary class="dim tiny" style="cursor:pointer">last output lines</summary><div class="fail-msg">${esc(String(g.last.tail).split('\n').filter((x) => x.trim()).slice(-6).join('\n'))}</div></details></td></tr>` : ''}`).join('')}</table>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">${['reviewer', 'security'].map((w) => V[w] ? `${chip(V[w].status === 'PASS' ? 'ok' : 'bad', `${w}: ${V[w].status}`)} <span class="dim tiny">${esc(V[w].note)} · ${tplus(Date.parse(V[w].ts) - clock.start)}</span>` : chip('none', `${w}: not run`)).join(' ')}</div>`
    : '<div class="empty">No gate has been run yet. The lead runs gates with <span class="mono">bash ../scripts/gate.sh fast</span>.</div>';

  // board
  $('board-r').textContent = `${st.board.filter((b) => b.state === 'done').length}/${st.board.length} done`;
  $('board').innerHTML = st.board.length ? `<table><tr><th>Task</th><th>Lane</th><th>R</th><th>Status</th><th>Blocker</th></tr>${st.board.map((b) => `<tr><td>${esc(b.task)}</td><td class="mono tiny">${esc(b.lane)}</td><td class="mono tiny dim">${esc(b.r)}</td><td>${stateChip(b.state)}</td><td class="dim tiny">${esc(b.blocker === '-' ? '' : b.blocker)}</td></tr>`).join('')}</table>` : '<div class="empty">BOARD.md is empty.</div>';

  // agents
  const leadTok = A.lead.reduce((n, l) => n + l.out, 0); const subTok = A.subs.reduce((n, s) => n + s.out, 0);
  $('agents-r').textContent = `lead ${k(leadTok)} · team ${k(subTok)} output tokens`;
  $('agents-types').innerHTML = A.byType.length ? `<table><tr><th>Role</th><th>Model</th><th class="num">Runs</th><th class="num">Tool calls</th><th class="num">Out tokens</th></tr>${A.byType.map((t) => `<tr><td class="mono">${esc(t.type)}${t.running ? ' ' + chip('run', `● ${t.running}`) : ''}</td><td class="mono tiny dim">${esc(shortModel(t.model))}</td><td class="num">${t.runs}</td><td class="num">${t.tools}</td><td class="num">${k(t.out)}</td></tr>`).join('')}</table>` : '<div class="empty">No subagent has run since the start.</div>';
  $('agents').innerHTML = A.subs.length ? `<table><tr><th>Run</th><th>Status</th><th class="num">Tools</th><th class="num">Duration</th><th>Last activity</th></tr>${A.subs.map((s) => `<tr><td><span class="mono tiny">${esc(s.type)}</span><div class="dim tiny">${esc(s.desc)}</div></td><td>${stateChip(s.state)}</td><td class="num">${s.tools}</td><td class="num">${s.first && s.last ? hm((s.last - s.first) / 60000) : '—'}</td><td class="dim tiny">${ago(s.last, now)}</td></tr>`).join('')}</table>` : '';

  // requirements
  $('req-r').textContent = `${rDone} done · ${rTested} tested · ${R.filter((r) => r.ambiguous).length} ambiguous`;
  $('reqs').innerHTML = R.length ? `<div class="reqs">${R.map((r) => `<div class="req ${r.state} ${r.tests ? 'tested' : ''} ${r.ambiguous ? 'amb' : ''}" title="R${r.id}: ${esc(r.text)}">R${r.id}<small>${r.tests ? `${r.tests} test refs` : r.state}</small></div>`).join('')}</div>
    <div class="legend"><span><i class="sw" style="background:var(--okbg);border-color:var(--ok)"></i>done + tested</span><span><i class="sw" style="border-color:var(--ok)"></i>done</span><span><i class="sw" style="background:var(--runbg);border-color:var(--run)"></i>in progress</span><span><i class="sw"></i>todo / unplanned</span><span style="color:var(--warn)">⚠ ambiguous in brief</span></div>` : '<div class="empty">No R-numbers in SPEC.md yet.</div>';

  // security posture
  const db = st.db;
  $('db-r').textContent = db ? `${db.tables} tables · ${db.users} auth users` : 'database offline';
  if (db) {
    const rows = [
      ['RLS enabled on every public table', db.rls === db.tables && db.tables > 0, `${db.rls}/${db.tables}`],
      ['anon has no table grants', db.anonGrants === 0, `${db.anonGrants} grants`],
      ['every UPDATE policy has WITH CHECK', db.updNoCheck === 0, `${db.updNoCheck} missing`],
      ['no SECURITY DEFINER function in public', db.secdefPublic === 0, `${db.secdefPublic} found`],
      ['public views are security_invoker', db.unsafeViews === 0, `${db.unsafeViews} unsafe`],
      ['no public storage bucket', db.publicBuckets === 0, `${db.publicBuckets}/${db.buckets} public`],
    ];
    $('security').innerHTML = `<table>${rows.map(([l, ok, d]) => `<tr><td>${esc(l)}</td><td class="num dim tiny">${esc(d)}</td><td style="width:70px">${ok ? chip('ok', '✔ ok') : chip('bad', '✖ fix')}</td></tr>`).join('')}</table>
      <div class="dim tiny" style="margin:10px 0 6px">${db.policies} policies · ${db.privateFns} functions in <span class="mono">private</span> · ${db.constraints} constraints (check/unique/exclude/fk)</div>
      <div class="scroll" style="max-height:170px"><table><tr><th>Table</th><th>RLS</th><th class="num">Policies</th><th class="num">Rows</th></tr>${db.list.map((t) => `<tr><td class="mono tiny">${esc(t.name)}</td><td>${t.rls ? chip('ok', 'on') : chip('bad', 'off')}</td><td class="num">${t.policies}</td><td class="num">${t.rows}</td></tr>`).join('')}</table></div>`;
  } else $('security').innerHTML = '<div class="empty">Local Supabase is not reachable on :54322.</div>';

  // decisions
  const kinds = { pending: ['warn', 'pending'], marwan: ['ok', meta.candidate], kit: ['kit', 'kit rule'], brief: ['run', 'brief'], other: ['none', 'other'] };
  $('dec-r').textContent = Object.entries(D.reduce((m, d) => (m[d.kind] = (m[d.kind] || 0) + 1, m), {})).map(([k_, n]) => `${n} ${kinds[k_][1]}`).join(' · ');
  $('decisions').innerHTML = D.length ? D.map((d) => `<div class="dec"><span class="mono dim">${esc(d.id)}</span><div><div>${esc(d.what)}</div><div class="why">${esc(d.why)}${d.rejected ? ` · <span class="faint">rejected: ${esc(d.rejected)}</span>` : ''}</div></div>${chip(kinds[d.kind][0], kinds[d.kind][1])}</div>`).join('') : '<div class="empty">No decisions logged yet.</div>';

  // commits
  const C = st.commits;
  $('commits-r').textContent = `${C.list.length} commits${C.dirty ? ` · ${C.dirty} uncommitted files` : ' · clean tree'}`;
  $('commits').innerHTML = C.list.length ? C.list.map((c) => `<div class="commit"><span class="mono dim tiny">${esc(c.hash)}</span><span class="mono tiny">${c.t != null && c.t >= 0 ? tplus(c.t) : clockTime(c.at)}</span><span>${esc(c.msg)}</span><span class="mono tiny dim">${c.files}f <span style="color:var(--ok)">+${c.add}</span> <span style="color:var(--bad)">−${c.del}</span></span></div>`).join('') : '<div class="empty">No commits in ./app yet.</div>';

  // test files
  const F = st.tests.files;
  $('tests-r').textContent = T ? `latest report: ${T.report} · ${ago(T.at, now)}` : '';
  $('testfiles').innerHTML = F.length ? `<table><tr><th>File</th><th class="num">Pass</th><th class="num">Fail</th><th class="num">Skip</th><th class="num">Time</th></tr>${F.map((f) => `<tr><td class="mono tiny">${esc(f.file)}${f.failures.map((x) => `<div class="fail-msg">✖ ${esc(x.name)} — ${esc(x.msg)}</div>`).join('')}</td><td class="num" style="color:var(--ok)">${f.passed}</td><td class="num" style="color:${f.failed ? 'var(--bad)' : 'var(--faint)'}">${f.failed}</td><td class="num dim">${f.skipped}</td><td class="num dim">${(f.ms / 1000).toFixed(1)}s</td></tr>`).join('')}</table>` : '<div class="empty">No test report yet. Gate runs write reports to .tests/.</div>';

  // stack
  const S = st.stack; const c = st.code;
  const svc = (name, up, port) => `<div class="svc"><span>${esc(name)} <span class="faint mono tiny">${port}</span></span>${up ? chip('ok', '● up') : chip('none', '○ down')}</div>`;
  $('stack').innerHTML = `<div class="stack">${svc('Supabase API', S.api, ':54321')}${svc('Postgres', S.db, ':54322')}${svc('Studio', S.studio, ':54323')}${svc('Next dev', S.dev || S.dev2, S.dev ? ':3000' : ':3100')}</div>
    <div class="svc" style="margin-top:8px"><span>DB lock <span class="faint tiny">reset vs tests</span></span>${S.lock === 'free' ? chip('ok', 'free') : chip('warn', S.lock)}</div>
    <table style="margin-top:12px"><tr><th>Code</th><th class="num">Files</th><th class="num">Lines</th></tr>
    <tr><td>App (src)</td><td class="num">${c.app.files}</td><td class="num">${c.app.lines}</td></tr>
    <tr><td>Migrations</td><td class="num">${c.migrations.files}</td><td class="num">${c.migrations.lines}</td></tr>
    <tr><td>Seed</td><td class="num">${c.seed.files}</td><td class="num">${c.seed.lines}</td></tr>
    <tr><td>Tests</td><td class="num">${c.tests.files}</td><td class="num">${c.tests.lines}</td></tr></table>
    <div class="dim tiny" style="margin-top:10px">Routes</div><div class="mono tiny">${c.routes.length ? c.routes.map(esc).join('<br>') : '<span class="faint">none yet</span>'}</div>`;

  $('foot-l').textContent = `kit ${meta.kit}`;
  $('foot-r').textContent = window.__STATIC__ ? `snapshot taken ${new Date(now).toLocaleString()} at ${hm(E)} elapsed` : `refreshed ${clockTime(now)} · every 3s`;
}

async function tick() {
  try { const r = await fetch('/api/state', { cache: 'no-store' }); render(await r.json()); $('live').className = 'dot'; }
  catch { $('live').className = 'dot static'; $('mode').textContent = 'CONTROL ROOM · OFFLINE'; }
}
if (window.__STATIC__) {
  $('live').className = 'dot static'; $('mode').textContent = 'CONTROL ROOM · SNAPSHOT'; $('snap').style.display = 'none'; render(window.__STATIC__);
} else {
  tick(); setInterval(tick, 3000);
  $('snap').onclick = async () => {
    $('snap').textContent = 'Saving…';
    try { const r = await fetch('/api/snapshot', { method: 'POST' }); const j = await r.json(); $('snap').textContent = `Saved ${j.file}`; }
    catch { $('snap').textContent = 'Snapshot failed'; }
    setTimeout(() => { $('snap').textContent = 'Save snapshot → app/docs'; }, 5000);
  };
}
</script>
</body>
</html>
